<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotatris - Circular Puzzle</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .glow-pink {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }
        .piece-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .piece-card.selected {
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            transform: scale(1.05) translateY(-4px);
            background: rgba(15, 23, 42, 0.9);
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 sm:p-4 bg-slate-950 text-slate-100">

    <!-- Header / Scoreboard -->
    <header class="w-full max-w-xl flex justify-between items-center bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-lg z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-xl font-bold shadow-md shadow-cyan-500/20">
                <i class="fa-solid fa-arrows-spin text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">ROTATRIS</h1>
                <p class="text-xs text-slate-400 font-medium">25×25 Bomb-Clear Puzzle</p>
            </div>
        </div>

        <div class="flex gap-4 sm:gap-6">
            <div class="text-right">
                <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Score</div>
                <div id="score" class="text-2xl font-black text-cyan-400">0</div>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Clears</div>
                <div id="lines" class="text-2xl font-black text-pink-500">0</div>
            </div>
        </div>
    </header>

    <!-- Main Game Workspace -->
    <main class="relative flex-1 w-full max-w-xl flex items-center justify-center my-2">
        <!-- Canvas Canvas Container -->
        <div id="canvas-container" class="relative w-full aspect-square max-h-[60vh] max-w-[60vh] flex items-center justify-center rounded-3xl bg-slate-900/50 border border-slate-800/80 shadow-2xl p-2">
            <canvas id="gameCanvas" class="w-full h-full cursor-crosshair rounded-2xl"></canvas>
            
            <!-- Center Rotation Controls Overlay -->
            <button id="rotate-left-btn" class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-800/80 border border-slate-700 text-cyan-400 hover:text-white hover:bg-cyan-600/50 flex items-center justify-center text-lg shadow-lg active:scale-95 transition-all" title="Rotate Board Left (-90°)">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="rotate-right-btn" class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-slate-800/80 border border-slate-700 text-cyan-400 hover:text-white hover:bg-cyan-600/50 flex items-center justify-center text-lg shadow-lg active:scale-95 transition-all" title="Rotate Board Right (+90°)">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </main>

    <!-- Controls & Piece Dock -->
    <footer class="w-full max-w-xl flex flex-col gap-3 z-10 mb-1">
        <!-- Action Bar: Rotation & Drop Controls -->
        <div class="flex gap-2 justify-between items-center">
            <div class="flex gap-2">
                <button id="rotate-piece-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-200 text-xs sm:text-sm font-semibold flex items-center gap-2 active:scale-95 transition-all">
                    <i class="fa-solid fa-arrows-rotate text-cyan-400"></i> Rotate Piece
                </button>
                <button id="reset-board-btn" class="px-3 py-2 bg-slate-800/80 hover:bg-rose-900/40 border border-slate-700 hover:border-rose-700/50 rounded-xl text-slate-400 hover:text-rose-300 text-xs sm:text-sm font-semibold flex items-center gap-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Reset
                </button>
            </div>
            
            <div class="px-3 py-2 bg-slate-800 border border-slate-700 font-bold text-amber-400 text-xs sm:text-sm rounded-xl flex items-center gap-2 shadow-inner">
                <i class="fa-solid fa-bomb text-amber-400"></i> Bombs Clear Blocks
            </div>
        </div>

        <!-- Unified Dashboard (Left Piece, Center Bomb, Right Piece) -->
        <div class="w-full flex justify-between items-center gap-2 sm:gap-3 bg-slate-900/80 border border-slate-800 p-2 sm:p-3 rounded-2xl shadow-lg">
            
            <!-- Left: Piece Slot 0 -->
            <div data-slot="0" class="piece-card w-20 h-20 sm:w-24 sm:h-24 flex-shrink-0 cursor-pointer bg-slate-800/50 border-2 border-slate-700/70 hover:border-slate-500 rounded-xl p-1.5 flex items-center justify-center relative">
                <canvas id="slot-0-canvas" class="w-full h-full"></canvas>
            </div>
            
            <!-- Center: Bomb Channel (Circular Timer) -->
            <div id="bomb-channel" class="flex flex-col items-center justify-center mx-1 sm:mx-3">
                <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center bg-slate-900 rounded-2xl border border-slate-700/80 shadow-inner">
                    <!-- Radial Progress Wheel -->
                    <div id="bomb-radial-progress" class="absolute inset-2 rounded-full transition-all duration-75 ease-linear" style="background: conic-gradient(#06b6d4 0deg, #1e293b 0deg);"></div>
                    
                    <!-- Inner Cutout Ring -->
                    <div class="absolute inset-[14px] sm:inset-[16px] bg-slate-900 rounded-full flex items-center justify-center z-10 shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)]"></div>

                    <!-- Active Bomb (Centered) -->
                    <div id="active-bomb-slot" class="piece-card z-20 cursor-pointer rounded-full w-14 h-14 sm:w-16 sm:h-16 flex flex-col items-center justify-center relative opacity-50 pointer-events-none transition-all">
                        <canvas id="active-bomb-canvas" class="w-full h-full absolute inset-0 z-10 scale-[0.8]"></canvas>
                        <!-- Floating Timer Text -->
                        <div id="bomb-timer-text" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-950/80 px-1.5 py-0.5 rounded text-[9px] sm:text-[10px] font-mono text-cyan-400 z-30 pointer-events-none border border-slate-700/50">15.0s</div>
                    </div>

                    <!-- Next Bomb Indicator (Badge) -->
                    <div class="absolute -bottom-2 -right-2 bg-slate-800 border border-slate-600 rounded-lg p-0.5 w-9 h-9 sm:w-10 sm:h-10 flex flex-col items-center justify-center z-30 shadow-lg">
                        <div class="text-[5px] sm:text-[6px] font-bold text-slate-400 absolute top-0.5 w-full text-center uppercase tracking-widest z-10 drop-shadow-md">Next</div>
                        <canvas id="next-bomb-canvas" class="w-full h-full absolute inset-0 rounded-lg scale-[0.7] mt-1.5"></canvas>
                    </div>
                </div>
            </div>
            
            <!-- Right: Piece Slot 1 -->
            <div data-slot="1" class="piece-card w-20 h-20 sm:w-24 sm:h-24 flex-shrink-0 cursor-pointer bg-slate-800/50 border-2 border-slate-700/70 hover:border-slate-500 rounded-xl p-1.5 flex items-center justify-center relative">
                <canvas id="slot-1-canvas" class="w-full h-full"></canvas>
            </div>
            
        </div>
    </footer>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl space-y-5">
            <div class="w-16 h-16 bg-rose-500/10 border border-rose-500/30 text-rose-500 rounded-2xl flex items-center justify-center text-3xl mx-auto">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>
            <div>
                <h2 class="text-2xl font-black text-white">Grid Overflow!</h2>
                <p class="text-slate-400 text-sm mt-1">No valid placements remaining on the 25×25 grid.</p>
            </div>
            <div class="bg-slate-800/60 rounded-xl p-4 flex justify-around">
                <div>
                    <div class="text-xs text-slate-400 uppercase">Final Score</div>
                    <div id="final-score" class="text-xl font-bold text-cyan-400">0</div>
                </div>
                <div class="border-r border-slate-700"></div>
                <div>
                    <div class="text-xs text-slate-400 uppercase">Matches Cleared</div>
                    <div id="final-rings" class="text-xl font-bold text-pink-500">0</div>
                </div>
            </div>
            <button id="restart-btn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold text-white rounded-xl shadow-lg shadow-cyan-500/25 transition-all">
                Play Again
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // Constants
        const GRID_SIZE = 25; // 25x25 Cartesian space
        const CENTER = (GRID_SIZE - 1) / 2; // 12 center point
        const CORE_MIN = 10; // 5x5 Base Bounds (Indices 10 to 14)
        const CORE_MAX = 14;

        // Color Palette for Polyominoes (Red, Blue, Green, Yellow)
        const PIECE_COLORS = [
            '#ef4444', // Red
            '#3b82f6', // Blue
            '#22c55e', // Green
            '#eab308'  // Yellow
        ];

        // Standard Tetromino/Polyomino Definitions (Matrix shapes)
        const PIECE_SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]], // J
            [[0, 1, 1], [1, 1, 0]], // S
            [[1, 1, 0], [0, 1, 1]], // Z
            [[1, 1, 1]], // Tri-I
            [[1, 1], [1, 0]], // Corner-3
            [[1]] // Single Dot
        ];

        // State Engine
        let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let hoverColumn = CENTER; // Current top-down drop column
        let selectedSlotIndex = 0;
        let selectedIsBomb = false;
        let activeBomb = null;
        let nextBomb = null;
        let bombCooldownTimer = 15.0;
        let bombReady = false;
        let lastTime = performance.now();
        let timerFrameId = null;
        let pieceDeck = [null, null];
        let score = 0;
        let ringsCleared = 0;
        let particles = [];
        let isResolving = false; // Prevents interactions during cascades

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElem = document.getElementById('score');
        const linesElem = document.getElementById('lines');
        const aimAngleElem = document.getElementById('aim-angle');
        const gameOverModal = document.getElementById('game-over-modal');

        // Audio Context Synthesizer (No external asset files required)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playDrop() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playClear() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
            playRotate() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
        }
        const sfx = new SoundFX();

        // Helper: Generate Random Piece Structure
        function generateRandomPiece() {
            const colorIdx = Math.floor(Math.random() * PIECE_COLORS.length);
            const color = PIECE_COLORS[colorIdx];
            
            const shapeIdx = Math.floor(Math.random() * PIECE_SHAPES.length);
            return {
                shape: JSON.parse(JSON.stringify(PIECE_SHAPES[shapeIdx])),
                color: color,
                isBomb: false,
                isOmniBomb: false
            };
        }

        // Helper: Generate Random Bomb Structure
        function generateRandomBomb() {
            const rand = Math.random();
            if (rand < 0.15) {
                // Every-Color / Rainbow Omni Bomb (15%)
                return {
                    shape: [[1]],
                    color: '#ffffff',
                    isBomb: false,
                    isOmniBomb: true
                };
            } else {
                // Standard Color Bomb (85%)
                const colorIdx = Math.floor(Math.random() * PIECE_COLORS.length);
                return {
                    shape: [[1]],
                    color: PIECE_COLORS[colorIdx],
                    isBomb: true,
                    isOmniBomb: false
                };
            }
        }

        // Initialize / Reset Game
        function initGame() {
            grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            score = 0;
            ringsCleared = 0;
            hoverColumn = CENTER;
            selectedSlotIndex = 0;
            selectedIsBomb = false;
            particles = [];
            
            scoreElem.textContent = '0';
            linesElem.textContent = '0';
            gameOverModal.classList.add('hidden');

            // Fill Piece Deck with 2 random pieces
            for (let i = 0; i < 2; i++) {
                pieceDeck[i] = generateRandomPiece();
            }

            activeBomb = generateRandomBomb();
            nextBomb = generateRandomBomb();
            bombCooldownTimer = 15.0;
            bombReady = false;
            
            if (timerFrameId) cancelAnimationFrame(timerFrameId);
            lastTime = performance.now();
            timerFrameId = requestAnimationFrame(updateTimer);

            resizeCanvas();
            updateDeckUI();
            updateBombUI();
            render();
        }

        function updateTimer(time) {
            if (!isResolving && !bombReady) {
                const dt = (time - lastTime) / 1000;
                bombCooldownTimer -= dt;
                if (bombCooldownTimer <= 0) {
                    bombCooldownTimer = 0;
                    bombReady = true;
                    updateBombUI();
                } else {
                    updateBombUIProgress();
                }
            }
            lastTime = time;
            timerFrameId = requestAnimationFrame(updateTimer);
        }

        function updateBombUIProgress() {
            const pct = Math.max(0, (15 - bombCooldownTimer) / 15);
            const degrees = pct * 360;
            const radialElem = document.getElementById('bomb-radial-progress');
            if (radialElem) {
                radialElem.style.background = `conic-gradient(#06b6d4 ${degrees}deg, #1e293b ${degrees}deg)`;
            }
            const timerText = document.getElementById('bomb-timer-text');
            if (timerText) {
                timerText.textContent = bombCooldownTimer.toFixed(1) + 's';
            }
        }

        function updateBombUI() {
            const activeSlot = document.getElementById('active-bomb-slot');
            const radialElem = document.getElementById('bomb-radial-progress');
            const timerText = document.getElementById('bomb-timer-text');
            
            if (bombReady) {
                if (activeSlot) activeSlot.classList.remove('opacity-50', 'pointer-events-none');
                if (radialElem) {
                    radialElem.style.background = `conic-gradient(#ec4899 360deg, #1e293b 360deg)`;
                    radialElem.classList.add('glow-pink');
                }
                if (timerText) {
                    timerText.textContent = 'RDY';
                    timerText.classList.add('font-black', 'text-pink-500');
                    timerText.classList.remove('text-cyan-400');
                }
            } else {
                if (activeSlot) activeSlot.classList.add('opacity-50', 'pointer-events-none');
                if (radialElem) {
                    radialElem.classList.remove('glow-pink');
                }
                if (timerText) {
                    timerText.classList.remove('font-black', 'text-pink-500');
                    timerText.classList.add('text-cyan-400');
                }
                if (selectedIsBomb) {
                    selectedIsBomb = false;
                    selectedSlotIndex = 0;
                    updateDeckUI();
                }
            }
            
            if (selectedIsBomb) {
                if (activeSlot) activeSlot.classList.add('selected');
            } else {
                if (activeSlot) activeSlot.classList.remove('selected');
            }
        }

        // Resize Canvas dynamically with High DPI rendering
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            // Render Deck Canvases
            for (let i = 0; i < 2; i++) {
                renderDeckPiece(i);
            }
            renderBombCanvases();
        }

        function renderBombCanvases() {
            renderBombToCanvas('active-bomb-canvas', activeBomb);
            renderBombToCanvas('next-bomb-canvas', nextBomb);
        }

        function renderBombToCanvas(canvasId, piece) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !piece) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            const dCtx = canvas.getContext('2d');
            dCtx.scale(dpr, dpr);

            dCtx.clearRect(0, 0, rect.width, rect.height);
            
            const cellSize = Math.min(rect.width, rect.height) * 0.7;
            const startX = (rect.width - cellSize) / 2;
            const startY = (rect.height - cellSize) / 2 + 2;

            if (piece.isOmniBomb) {
                const cx = startX + cellSize / 2;
                const cy = startY + cellSize / 2;
                const grad = dCtx.createRadialGradient(cx, cy, 1, cx, cy, cellSize / 2);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.33, '#ec4899');
                grad.addColorStop(0.66, '#06b6d4');
                grad.addColorStop(1, '#eab308');
                dCtx.fillStyle = grad;
                dCtx.shadowColor = '#06b6d4';
                dCtx.shadowBlur = 8;
                dCtx.beginPath();
                dCtx.arc(cx, cy, cellSize / 2 - 1, 0, Math.PI * 2);
                dCtx.fill();
            } else {
                dCtx.fillStyle = piece.color;
                dCtx.shadowColor = piece.color;
                dCtx.shadowBlur = 8;
                dCtx.beginPath();
                dCtx.roundRect(startX, startY, cellSize, cellSize, 3);
                dCtx.fill();
                
                dCtx.fillStyle = '#ffffff';
                dCtx.shadowBlur = 0;
                dCtx.beginPath();
                dCtx.arc(startX + cellSize/2, startY + cellSize/2, cellSize/4, 0, Math.PI * 2);
                dCtx.fill();
            }
        }

        // Render Deck Piece Previews
        function renderDeckPiece(slotIdx) {
            const deckCanvas = document.getElementById(`slot-${slotIdx}-canvas`);
            if (!deckCanvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = deckCanvas.getBoundingClientRect();
            deckCanvas.width = rect.width * dpr;
            deckCanvas.height = rect.height * dpr;
            const dCtx = deckCanvas.getContext('2d');
            dCtx.scale(dpr, dpr);

            dCtx.clearRect(0, 0, rect.width, rect.height);

            const piece = pieceDeck[slotIdx];
            if (!piece) return;

            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            const cellSize = Math.min((rect.width - 16) / cols, (rect.height - 16) / rows);
            
            const startX = (rect.width - cols * cellSize) / 2;
            const startY = (rect.height - rows * cellSize) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (piece.shape[r][c]) {
                        if (piece.isOmniBomb) {
                            // Rainbow animated core
                            const cx = startX + c * cellSize + cellSize / 2;
                            const cy = startY + r * cellSize + cellSize / 2;
                            const grad = dCtx.createRadialGradient(cx, cy, 2, cx, cy, cellSize / 2);
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(0.33, '#ec4899');
                            grad.addColorStop(0.66, '#06b6d4');
                            grad.addColorStop(1, '#eab308');
                            dCtx.fillStyle = grad;
                            dCtx.shadowColor = '#06b6d4';
                            dCtx.shadowBlur = 10;
                            dCtx.beginPath();
                            dCtx.arc(cx, cy, cellSize / 2 - 2, 0, Math.PI * 2);
                            dCtx.fill();
                        } else {
                            dCtx.fillStyle = piece.color;
                            dCtx.shadowColor = piece.color;
                            dCtx.shadowBlur = piece.isBomb ? 12 : 6;
                            dCtx.beginPath();
                            dCtx.roundRect(
                                startX + c * cellSize + 1,
                                startY + r * cellSize + 1,
                                cellSize - 2,
                                cellSize - 2,
                                4
                            );
                            dCtx.fill();
                            
                            if (piece.isBomb) {
                                dCtx.fillStyle = '#ffffff';
                                dCtx.shadowBlur = 0;
                                dCtx.beginPath();
                                dCtx.arc(
                                    startX + c * cellSize + cellSize/2, 
                                    startY + r * cellSize + cellSize/2, 
                                    cellSize/4, 0, Math.PI * 2
                                );
                                dCtx.fill();
                            }
                        }
                        dCtx.shadowBlur = 0;
                    }
                }
            }
        }

        // Update Active UI Selection for Deck
        function updateDeckUI() {
            const cards = document.querySelectorAll('.piece-card[data-slot]');
            cards.forEach((card, idx) => {
                const slot = parseInt(card.getAttribute('data-slot'));
                if (!selectedIsBomb && slot === selectedSlotIndex) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
            updateBombUI();
        }

        function getSelectedPiece() {
            if (selectedIsBomb) return activeBomb;
            return pieceDeck[selectedSlotIndex];
        }

        // Rotate Selected Piece Matrix 90° Clockwise
        function rotateSelectedPiece() {
            if (selectedIsBomb) return; // Cannot rotate 1x1 bombs
            sfx.init();
            sfx.playRotate();
            const piece = pieceDeck[selectedSlotIndex];
            if (!piece) return;

            const oldShape = piece.shape;
            const rows = oldShape.length;
            const cols = oldShape[0].length;
            const newShape = Array(cols).fill(null).map(() => Array(rows).fill(0));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    newShape[c][rows - 1 - r] = oldShape[r][c];
                }
            }

            piece.shape = newShape;
            renderDeckPiece(selectedSlotIndex);
            render();
        }

        // Rotate Board Grid 90 degrees logically
        function rotateBoard(deg) {
            if (isResolving) return;
            sfx.init();
            sfx.playRotate();
            let newGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            
            if (deg > 0) { // 90° Clockwise
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        newGrid[c][GRID_SIZE - 1 - r] = grid[r][c];
                    }
                }
            } else { // 90° Counter-Clockwise
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        newGrid[GRID_SIZE - 1 - c][r] = grid[r][c];
                    }
                }
            }
            grid = newGrid;
            render();
        }

        // Compute Trajectory and Final Position for Top-Down Drop
        function computeDropPlacement() {
            const piece = getSelectedPiece();
            if (!piece) return null;

            const rows = piece.shape.length;
            const cols = piece.shape[0].length;
            
            // Align piece center with hoverColumn
            const startX = Math.round(hoverColumn - cols / 2);

            let bestY = -rows;
            
            // Drop piece from above grid down to the bottom
            for (let y = -rows; y <= GRID_SIZE; y++) {
                const cells = getPieceGridCellsAt(piece.shape, startX, y);
                if (isValidPlacement(cells)) {
                    bestY = y;
                } else {
                    break;
                }
            }

            // Verify the piece actually landed on valid structure (core or locked blocks)
            const nextY = bestY + 1;
            const cellsBelow = getPieceGridCellsAt(piece.shape, startX, nextY);
            let landedOnStructure = false;

            for (const cell of cellsBelow) {
                if (cell.y >= GRID_SIZE) {
                    // Hit grid floor - falls into void, not valid for Rotatris center-build
                } else if (cell.y >= 0) {
                    if (cell.x >= CORE_MIN && cell.x <= CORE_MAX && cell.y >= CORE_MIN && cell.y <= CORE_MAX) {
                        landedOnStructure = true; // Landed on core
                    } else if (grid[cell.y][cell.x] !== null) {
                        landedOnStructure = true; // Landed on locked piece
                    }
                }
            }

            if (!landedOnStructure) {
                return null;
            }

            return getPieceGridCellsAt(piece.shape, startX, bestY);
        }

        // Helper: Get Grid Matrix Indices for Piece
        function getPieceGridCellsAt(shape, startX, startY) {
            const cells = [];
            const rows = shape.length;
            const cols = shape[0].length;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c]) {
                        cells.push({
                            x: startX + c,
                            y: startY + r
                        });
                    }
                }
            }
            return cells;
        }

        // Check Matrix Bounds and Existing Block Collision
        function isValidPlacement(cells) {
            for (const cell of cells) {
                // Bounds check - only restrict X bounds and bottom floor
                // Pieces can spawn above the board (y < 0)
                if (cell.x < 0 || cell.x >= GRID_SIZE || cell.y >= GRID_SIZE) {
                    return false;
                }

                if (cell.y >= 0) {
                    // Core 5x5 square protection check
                    if (cell.x >= CORE_MIN && cell.x <= CORE_MAX && cell.y >= CORE_MIN && cell.y <= CORE_MAX) {
                        return false;
                    }
                    // Grid occupation check
                    if (grid[cell.y][cell.x] !== null) {
                        return false;
                    }
                }
            }
            return true;
        }

        // Place Piece on Board and Trigger Replenishment
        async function placePiece() {
            if (isResolving) return;
            sfx.init();
            const targetCells = computeDropPlacement();
            if (!targetCells || targetCells.length === 0) return;

            isResolving = true;
            const piece = getSelectedPiece();

            // Check if piece locked entirely offscreen (Game Over condition)
            const lockedOffscreen = targetCells.every(c => c.y < 0);

            // Lock piece onto grid
            for (const cell of targetCells) {
                if (cell.y >= 0 && cell.y < GRID_SIZE) {
                    grid[cell.y][cell.x] = { 
                        color: piece.color, 
                        isBomb: piece.isBomb,
                        isOmniBomb: piece.isOmniBomb 
                    };
                    createParticles(cell.x, cell.y, piece.isOmniBomb ? '#06b6d4' : piece.color);
                }
            }

            sfx.playDrop();

            if (selectedIsBomb) {
                // Use bomb, reset cooldown
                activeBomb = nextBomb;
                nextBomb = generateRandomBomb();
                bombReady = false;
                bombCooldownTimer = 15.0;
                selectedIsBomb = false;
                selectedSlotIndex = 0;
                updateDeckUI();
                renderBombCanvases();
            } else {
                // Replenish slot with brand new piece immediately
                pieceDeck[selectedSlotIndex] = generateRandomPiece();
                renderDeckPiece(selectedSlotIndex);
            }

            // Trigger bomb detonations and cascades
            await resolveBoardState(targetCells, piece);

            scoreElem.textContent = score;

            // Check Game Over
            if (lockedOffscreen || checkGameOver()) {
                document.getElementById('final-score').textContent = score;
                document.getElementById('final-rings').textContent = ringsCleared;
                gameOverModal.classList.remove('hidden');
            }

            isResolving = false;
            render();
        }

        // Helper: Find connected clusters (for color bombs)
        function getCluster(startX, startY, color, visited) {
            let cluster = [];
            let stack = [{x: startX, y: startY}];
            while (stack.length > 0) {
                let curr = stack.pop();
                if (visited[curr.y][curr.x]) continue;
                visited[curr.y][curr.x] = true;
                cluster.push(curr);
                
                let neighbors = [
                    {x: curr.x+1, y: curr.y}, {x: curr.x-1, y: curr.y},
                    {x: curr.x, y: curr.y+1}, {x: curr.x, y: curr.y-1}
                ];
                
                for (let n of neighbors) {
                    if (n.x >= 0 && n.x < GRID_SIZE && n.y >= 0 && n.y < GRID_SIZE) {
                        if (grid[n.y][n.x] && !visited[n.y][n.x] && grid[n.y][n.x].color === color && !grid[n.y][n.x].isOmniBomb) {
                            stack.push(n);
                        }
                    }
                }
            }
            return cluster;
        }

        // Resolve bomb detonations and cascading gravity
        async function resolveBoardState(placedCells = [], placedPiece = null) {
            let cascadeMultiplier = 1;
            let resolving = true;
            let isFirstPass = true;

            while (resolving) {
                let toDestroy = new Set();

                if (isFirstPass && placedPiece) {
                    isFirstPass = false;

                    // 1. Every-Color (Rainbow) Bomb: 3-wide straight laser blast
                    if (placedPiece.isOmniBomb) {
                        const targetCol = hoverColumn;
                        for (let col = targetCol - 1; col <= targetCol + 1; col++) {
                            if (col >= 0 && col < GRID_SIZE) {
                                for (let r = 0; r < GRID_SIZE; r++) {
                                    if (grid[r][col] !== null && !(col >= CORE_MIN && col <= CORE_MAX && r >= CORE_MIN && r <= CORE_MAX)) {
                                        toDestroy.add(`${col},${r}`);
                                    }
                                }
                            }
                        }
                    } 
                    // 2. Standard Color Bomb: Explodes connected color cluster
                    else if (placedPiece.isBomb) {
                        for (let cell of placedCells) {
                            if (cell.y >= 0 && cell.y < GRID_SIZE) {
                                let visited = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
                                let cluster = getCluster(cell.x, cell.y, placedPiece.color, visited);
                                cluster.forEach(c => toDestroy.add(`${c.x},${c.y}`));
                            }
                        }
                    }
                }

                // 3. Check for any unexploded Color Bombs on the board touching their color
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        let cell = grid[y][x];
                        if (cell && cell.isBomb && !toDestroy.has(`${x},${y}`)) {
                            let visited = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
                            let cluster = getCluster(x, y, cell.color, visited);
                            if (cluster.length > 1) {
                                cluster.forEach(c => toDestroy.add(`${c.x},${c.y}`));
                            }
                        }
                    }
                }

                if (toDestroy.size === 0) {
                    resolving = false;
                    break;
                }

                // Apply destruction
                sfx.playClear();
                ringsCleared += 1;
                linesElem.textContent = ringsCleared;

                toDestroy.forEach(key => {
                    let [x, y] = key.split(',').map(Number);
                    let cell = grid[y][x];
                    if (cell) {
                        createParticles(x, y, cell.color || '#06b6d4');
                        grid[y][x] = null;
                    }
                });

                score += toDestroy.size * 15 * cascadeMultiplier;
                scoreElem.textContent = score;
                cascadeMultiplier++;
                render();

                // Pause for destruction effect
                await new Promise(r => setTimeout(r, 200));

                // Apply inward gravity step-by-step
                let moving = true;
                while (moving) {
                    moving = applyGravityStep();
                    if (moving) {
                        render();
                        await new Promise(r => setTimeout(r, 60));
                    }
                }
            }
        }

        // Option 6: Apply one step of gravity pulling blocks radially inward
        function applyGravityStep() {
            let moved = false;
            
            // Top quadrant: fall down
            for(let y = CORE_MIN - 1; y >= 0; y--) {
                for(let x = 0; x < GRID_SIZE; x++) {
                    if(grid[y][x]) {
                        if (Math.abs(y - CENTER) >= Math.abs(x - CENTER) && grid[y+1][x] === null) {
                            if(!(x >= CORE_MIN && x <= CORE_MAX && y+1 >= CORE_MIN && y+1 <= CORE_MAX)) {
                                grid[y+1][x] = grid[y][x];
                                grid[y][x] = null;
                                moved = true;
                            }
                        }
                    }
                }
            }
            
            // Bottom quadrant: fall up
            for(let y = CORE_MAX + 1; y < GRID_SIZE; y++) {
                for(let x = 0; x < GRID_SIZE; x++) {
                    if(grid[y][x]) {
                        if (Math.abs(y - CENTER) >= Math.abs(x - CENTER) && grid[y-1][x] === null) {
                            if(!(x >= CORE_MIN && x <= CORE_MAX && y-1 >= CORE_MIN && y-1 <= CORE_MAX)) {
                                grid[y-1][x] = grid[y][x];
                                grid[y][x] = null;
                                moved = true;
                            }
                        }
                    }
                }
            }

            // Left quadrant: fall right
            for(let x = CORE_MIN - 1; x >= 0; x--) {
                for(let y = 0; y < GRID_SIZE; y++) {
                    if(grid[y][x]) {
                        if (Math.abs(x - CENTER) > Math.abs(y - CENTER) && grid[y][x+1] === null) {
                            if(!(x+1 >= CORE_MIN && x+1 <= CORE_MAX && y >= CORE_MIN && y <= CORE_MAX)) {
                                grid[y][x+1] = grid[y][x];
                                grid[y][x] = null;
                                moved = true;
                            }
                        }
                    }
                }
            }

            // Right quadrant: fall left
            for(let x = CORE_MAX + 1; x < GRID_SIZE; x++) {
                for(let y = 0; y < GRID_SIZE; y++) {
                    if(grid[y][x]) {
                        if (Math.abs(x - CENTER) > Math.abs(y - CENTER) && grid[y][x-1] === null) {
                            if(!(x-1 >= CORE_MIN && x-1 <= CORE_MAX && y >= CORE_MIN && y <= CORE_MAX)) {
                                grid[y][x-1] = grid[y][x];
                                grid[y][x] = null;
                                moved = true;
                            }
                        }
                    }
                }
            }
            return moved;
        }

        // Particle Burst Effect
        function createParticles(gx, gy, color) {
            const rect = canvas.getBoundingClientRect();
            const cellSize = rect.width / GRID_SIZE;
            const px = (gx + 0.5) * cellSize;
            const py = (gy + 0.5) * cellSize;

            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x: px,
                    y: py,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    color: color
                });
            }
        }

        // Check if any available slot in deck can be placed on board
        function checkGameOver() {
            const originalSelectedBomb = selectedIsBomb;
            const originalSelected = selectedSlotIndex;
            selectedIsBomb = false;
            
            for (let i = 0; i < 2; i++) {
                if (!pieceDeck[i]) continue;
                selectedSlotIndex = i;
                
                // Scan all columns to see if there's any valid placement
                for (let col = 0; col < GRID_SIZE; col++) {
                    const savedCol = hoverColumn;
                    hoverColumn = col;
                    const cells = computeDropPlacement();
                    hoverColumn = savedCol;
                    
                    if (cells && cells.length > 0) {
                        // Ensure it locks at least partially on-screen
                        const isVisible = cells.some(c => c.y >= 0);
                        if (isVisible) {
                            selectedSlotIndex = originalSelected;
                            selectedIsBomb = originalSelectedBomb;
                            return false; // Found a valid move, game continues
                        }
                    }
                }
            }
            selectedSlotIndex = originalSelected;
            selectedIsBomb = originalSelectedBomb;
            return true; // No valid moves found
        }

        // Primary Drawing/Rendering Loop
        function render() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const cellSize = width / GRID_SIZE;

            ctx.clearRect(0, 0, width, height);

            // 1. Draw Grid Background Lines
            ctx.strokeStyle = 'rgba(51, 65, 85, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(width, i * cellSize);
                ctx.stroke();
            }

            // 2. Draw Locked Grid Bricks
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x] !== null) {
                        let cell = grid[y][x];
                        if (cell.isOmniBomb) {
                            const cx = x * cellSize + cellSize / 2;
                            const cy = y * cellSize + cellSize / 2;
                            const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, cellSize / 2);
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(0.33, '#ec4899');
                            grad.addColorStop(0.66, '#06b6d4');
                            grad.addColorStop(1, '#eab308');
                            ctx.fillStyle = grad;
                            ctx.shadowColor = '#06b6d4';
                            ctx.shadowBlur = 12;
                            ctx.beginPath();
                            ctx.arc(cx, cy, cellSize / 2 - 1, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            ctx.fillStyle = cell.color;
                            ctx.shadowColor = cell.color;
                            ctx.shadowBlur = cell.isBomb ? 12 : 8;
                            ctx.beginPath();
                            ctx.roundRect(
                                x * cellSize + 1,
                                y * cellSize + 1,
                                cellSize - 2,
                                cellSize - 2,
                                3
                            );
                            ctx.fill();
                            
                            if (cell.isBomb) {
                                ctx.fillStyle = '#ffffff';
                                ctx.shadowBlur = 0;
                                ctx.beginPath();
                                ctx.arc(
                                    x * cellSize + cellSize/2, 
                                    y * cellSize + cellSize/2, 
                                    cellSize/4, 0, Math.PI * 2
                                );
                                ctx.fill();
                            }
                        }
                        
                        ctx.shadowBlur = 0;
                    }
                }
            }

            // 3. Draw Center Core Structure (5x5 Square)
            const coreSize = 5 * cellSize;
            const startX = (width - coreSize) / 2;
            const startY = (height - coreSize) / 2;
            
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.rect(startX, startY, coreSize, coreSize);
            ctx.fill();
            ctx.stroke();

            // Core Glow Center Icon
            const centerPx = width / 2;
            const centerPy = height / 2;
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.arc(centerPx, centerPy, 4, 0, Math.PI * 2);
            ctx.fill();

            // 4. Draw Piece Placement Preview Ghost
            const previewCells = computeDropPlacement();
            if (previewCells && previewCells.length > 0 && !isResolving) {
                const currentPiece = getSelectedPiece();
                ctx.fillStyle = currentPiece ? currentPiece.color + '66' : 'rgba(6, 182, 212, 0.4)';
                
                for (const cell of previewCells) {
                    if (cell.y >= 0) {
                        ctx.beginPath();
                        ctx.roundRect(
                            cell.x * cellSize + 1,
                            cell.y * cellSize + 1,
                            cellSize - 2,
                            cellSize - 2,
                            3
                        );
                        ctx.fill();
                    }
                }
            }

            // 5. Render Animated Burst Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length > 0) {
                requestAnimationFrame(render);
            }
        }

        // Event Listeners Setup
        function setupEvents() {
            window.addEventListener('resize', () => {
                resizeCanvas();
                render();
            });

            // Deck Selection Clicks
            const deckCards = document.querySelectorAll('.piece-card[data-slot]');
            deckCards.forEach((card) => {
                card.addEventListener('click', (e) => {
                    if (isResolving) return;
                    selectedIsBomb = false;
                    selectedSlotIndex = parseInt(card.getAttribute('data-slot'));
                    updateDeckUI();
                    render();
                });
            });

            // Bomb Slot Click
            document.getElementById('active-bomb-slot').addEventListener('click', () => {
                if (isResolving || !bombReady) return;
                selectedIsBomb = true;
                updateDeckUI();
                render();
            });

            // Rotate Buttons
            document.getElementById('rotate-left-btn').addEventListener('click', () => rotateBoard(-90));
            document.getElementById('rotate-right-btn').addEventListener('click', () => rotateBoard(90));
            document.getElementById('rotate-piece-btn').addEventListener('click', rotateSelectedPiece);
            document.getElementById('reset-board-btn').addEventListener('click', initGame);
            document.getElementById('restart-btn').addEventListener('click', initGame);

            // Canvas Pointer Aiming & Placement Interactivity
            canvas.addEventListener('pointermove', (e) => {
                if (isResolving) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const cellSize = rect.width / GRID_SIZE;
                hoverColumn = Math.floor(x / cellSize);
                hoverColumn = Math.max(0, Math.min(GRID_SIZE - 1, hoverColumn));
                render();
            });

            canvas.addEventListener('pointerdown', (e) => {
                if (isResolving) return;
                sfx.init();
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const cellSize = rect.width / GRID_SIZE;
                hoverColumn = Math.floor(x / cellSize);
                hoverColumn = Math.max(0, Math.min(GRID_SIZE - 1, hoverColumn));
                placePiece();
            });

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (isResolving) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'q' || e.key === 'Q') {
                    rotateBoard(-90);
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'e' || e.key === 'E') {
                    rotateBoard(90);
                } else if (e.key === 'r' || e.key === 'R') {
                    rotateSelectedPiece();
                } else if (e.key === ' ' || e.key === 'Enter') {
                    placePiece();
                } else if (e.key === '1') {
                    selectedSlotIndex = 0;
                    updateDeckUI();
                    render();
                } else if (e.key === '2') {
                    selectedSlotIndex = 1;
                    updateDeckUI();
                    render();
                } else if (e.key === '3' || e.key === '4' || e.key === 'b' || e.key === 'B') {
                    if (bombReady) {
                        selectedIsBomb = true;
                        updateDeckUI();
                        render();
                    }
                }
            });
        }

        // Start Game Engine on Window Load
        window.onload = () => {
            setupEvents();
            initGame();
        };
    </script>
</body>
</html>
